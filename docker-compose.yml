services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-geoapify}
        VITE_GEOAPIFY_TILE_API_KEY: ${VITE_GEOAPIFY_TILE_API_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    expose:
      - "5004"
    deploy:
      replicas: 1
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5004"
      SERVE_CLIENT: "true"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      FORCE_HTTPS_CSP: "${FORCE_HTTPS_CSP:-false}"
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongo:27017/smartroute}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET (>=32 chars)}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET (>=32 chars)}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-15m}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-7d}"
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:-}"
      MAP_PROVIDER: "${MAP_PROVIDER:-geoapify}"
      GEOAPIFY_SERVER_API_KEY: "${GEOAPIFY_SERVER_API_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      SMTP_SERVICE: "${SMTP_SERVICE:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-SmartRoute Operations <no-reply@smartroute.local>}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
      FAST2SMS_API_KEY: "${FAST2SMS_API_KEY:-}"
      FAST2SMS_ROUTE: "${FAST2SMS_ROUTE:-otp}"
      SMS_WEBHOOK_URL: "${SMS_WEBHOOK_URL:-}"
      SMS_WEBHOOK_SECRET: "${SMS_WEBHOOK_SECRET:-}"
      OTP_TTL_MINUTES: "${OTP_TTL_MINUTES:-10}"
      OTP_MAX_ATTEMPTS: "${OTP_MAX_ATTEMPTS:-5}"
      OTP_RESEND_COOLDOWN_SECONDS: "${OTP_RESEND_COOLDOWN_SECONDS:-30}"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
